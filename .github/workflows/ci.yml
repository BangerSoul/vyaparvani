name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

jobs:
  typecheck-build-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Start server in Demo mode and run eval + P0 tests
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"healthy"'; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited prematurely:"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for server at http://127.0.0.1:3000/"
            cat server.log
            exit 1
          fi

          EVAL_OUT="$(npm run eval -- http://127.0.0.1:3000 | tee /dev/stderr)"
          echo "$EVAL_OUT" | grep -q "60/60 exact-match" || { echo "Golden eval failed (< 60/60)"; exit 1; }
          node scripts/test-p0.mjs http://127.0.0.1:3000

          npm install --no-save playwright
          npx playwright install --with-deps chromium || (npx playwright install chromium && sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64)
          node scripts/capture-ui.mjs http://127.0.0.1:3000 decks/assets/ui-screenshot.png
          node scripts/test-m3.mjs http://127.0.0.1:3000

      - name: Upload UI screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: decks/assets/ui-screenshot.png
          retention-days: 7
          if-no-files-found: error

      - name: Setup Python for deck verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and verify PDF deck
        run: |
          set -euo pipefail
          test -f scripts/build-deck.py || { echo "Missing scripts/build-deck.py"; exit 1; }
          test -f decks/assets/ui-screenshot.png || { echo "Missing decks/assets/ui-screenshot.png"; exit 1; }
          pip install --quiet reportlab pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 scripts/build-deck.py --deck decks/vyaparvani-idea.deck.json --output /tmp/vyaparvani-idea.pdf
          pdfinfo /tmp/vyaparvani-idea.pdf
          python3 - <<'PY'
          import os, subprocess
          pdf = "/tmp/vyaparvani-idea.pdf"
          size = os.path.getsize(pdf)
          assert size <= 10 * 1024 * 1024, f"PDF too large: {size} bytes"
          info = subprocess.check_output(["pdfinfo", pdf]).decode()
          assert any(line.startswith("Pages:") and line.split()[1] == "12" for line in info.splitlines()), f"Unexpected page count:\n{info}"
          for p in range(1, 13):
              txt = subprocess.check_output(["pdftotext", "-f", str(p), "-l", str(p), pdf, "-"]).decode().strip()
              assert len(txt) > 20, f"Page {p} has empty/insufficient text: {txt!r}"
              print(f"Page {p:02d}: {len(txt)} chars OK")
          print(f"Verified PDF size: {size} bytes")
          PY

      - name: Upload deck PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyaparvani-idea-pdf
          path: /tmp/vyaparvani-idea.pdf
          retention-days: 7
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vyaparvani:ci .

      - name: Smoke-test Docker standalone container & /api/health
        run: |
          set -euo pipefail
          docker run -d --name vv-ci -p 127.0.0.1:3000:3000 vyaparvani:ci
          trap 'docker logs vv-ci || true; docker rm -f vv-ci >/dev/null 2>&1 || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"healthy"'; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || { echo "Container healthcheck endpoint did not become ready"; exit 1; }

          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"mode":"demo"'
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS -X POST http://127.0.0.1:3000/api/parse \
            -H 'Content-Type: application/json' \
            -d '{"utterance":"5 kg chawal Gupta store ko bhej do"}' | grep -q '"Gupta Store"'
