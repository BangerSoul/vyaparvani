name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

jobs:
  typecheck-build-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Start server in Demo mode and run eval + P0 tests
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited prematurely:"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for server at http://127.0.0.1:3000/"
            cat server.log
            exit 1
          fi

          EVAL_OUT="$(npm run eval -- http://127.0.0.1:3000 | tee /dev/stderr)"
          echo "$EVAL_OUT" | grep -q "26/26 exact-match" || { echo "Golden eval failed (< 26/26)"; exit 1; }
          node scripts/test-p0.mjs http://127.0.0.1:3000

          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
          node scripts/capture-ui.mjs http://127.0.0.1:3000 decks/assets/ui-screenshot.png

      - name: Upload UI screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: decks/assets/ui-screenshot.png
          retention-days: 7

      - name: Setup Python for deck verification
        if: hashFiles('scripts/build-deck.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and verify PDF deck
        if: hashFiles('scripts/build-deck.py') != ''
        run: |
          set -euo pipefail
          if [ -f scripts/build-deck.py ] && [ -f decks/assets/ui-screenshot.png ]; then
            pip install --quiet reportlab pillow
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
            python3 scripts/build-deck.py --deck decks/vyaparvani-idea.deck.json --output /tmp/vyaparvani-idea.pdf
            pdfinfo /tmp/vyaparvani-idea.pdf
            python3 - <<'PY'
          import os, subprocess
          pdf = "/tmp/vyaparvani-idea.pdf"
          size = os.path.getsize(pdf)
          assert size <= 10 * 1024 * 1024, f"PDF too large: {size} bytes"
          info = subprocess.check_output(["pdfinfo", pdf]).decode()
          assert "Pages:           12" in info or "Pages:          12" in info or any(line.strip() == "Pages: 12" or (line.startswith("Pages:") and line.split()[1] == "12") for line in info.splitlines()), f"Unexpected page count:\n{info}"
          for p in range(1, 13):
              txt = subprocess.check_output(["pdftotext", "-f", str(p), "-l", str(p), pdf, "-"]).decode().strip()
              assert len(txt) > 20, f"Page {p} has empty/insufficient text: {txt!r}"
              print(f"Page {p:02d}: {len(txt)} chars OK")
          print(f"Verified PDF size: {size} bytes")
          PY
          fi

      - name: Upload deck PDF artifact
        if: hashFiles('scripts/build-deck.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vyaparvani-idea-pdf
          path: /tmp/vyaparvani-idea.pdf
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vyaparvani:ci .
