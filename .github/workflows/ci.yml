name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:

jobs:
  typecheck-build-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Start server in Demo mode and run eval
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited prematurely:"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for server at http://127.0.0.1:3000/"
            cat server.log
            exit 1
          fi

          npm run eval -- http://127.0.0.1:3000

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vyaparvani:ci .
